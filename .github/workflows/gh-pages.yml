name: github pages

on:
  push:
    branches:
      - gh-pages-preview  # Branch that drives the Pages preview at https://predictiple.github.io/velociraptor-docs/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - uses: actions/setup-go@v5
        with:
          go-version: '^1.25'

          # Caching seems to really slow down the build due to the time
          # taken to save the cache.
          cache: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          # extended: true

      - name: Prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/exchange_index.py
          python scripts/exchange_verify.py
          python scripts/blog_index.py
          python scripts/knowledge_base.py

      - name: BuildIndex
        run: make index

      - name: Build
        # Override baseURL so absolute links resolve to the preview site
        # rather than the production docs.velociraptor.app domain.
        run: hugo --baseURL https://predictiple.github.io/velociraptor-docs/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
